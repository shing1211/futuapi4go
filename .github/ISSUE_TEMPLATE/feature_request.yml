name: Feature request
description: Suggest an idea or new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: proto
    attributes:
      label: Related ProtoID / method
      description: From the Futu Proto Reference or docs, if applicable
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: API surface
      options:
        - Market data (pkg/qot)
        - Trading (pkg/trd)
        - System (pkg/sys)
        - Push / streaming (pkg/push)
        - Client / connection
        - Not sure
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
