name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # Use the curated CHANGELOG section for this version, if present.
          awk -v v="$ver" 'BEGIN{gsub(/\./,"\\.",v)}
            $0 ~ ("^## \\[v?" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f {print}' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            gh release create "$tag" --title "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" --title "$tag" --generate-notes --latest
          fi
