name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Format check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  docs:
    name: docs guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check README translations
        run: python3 scripts/check_i18n.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the working tree and the commit history, so the
          # history must be fetched rather than the default shallow clone.
          fetch-depth: 0
      # Pinned to an exact release tag rather than @latest or the floating
      # @v2 major tag, for the same reason govulncheck is pinned: an upstream
      # release must not change a security result without a commit.
      # See docs/adr/0012-ci-secret-scanning.md.
      - name: Scan repository history for credentials
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          # Required by gitleaks-action v2 on pull_request events: the action
          # calls the GitHub API with this token to report a finding. Without
          # it the job aborts within a few seconds and scans nothing, which
          # would leave pull requests with no secret scanning at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # .gitleaks.toml in the repository root is auto-detected. The leading
          # dot is required; gitleaks does not pick up a bare `gitleaks.toml`.
          # Its allowlists suppress specific paths, never a rule class.
